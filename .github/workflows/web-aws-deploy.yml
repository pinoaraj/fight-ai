name: Web AWS Deploy
# The analysis worker is deployed as a separate ECS service and writes CloudWatch logs.

on:
  workflow_dispatch:
  push:
    branches: [web/mvp]
    paths:
      - '.github/workflows/web-aws-deploy.yml'
      - '.github/workflows/web-streaming-smoke.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'tsconfig.json'
      - 'instrumentation.ts'
      - 'scripts/**'
      - 'app/**'
      - 'infra/aws/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-aws-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_REGION: sa-east-1
  ECR_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::379549361550:role/FightAIGitHubDeployRole
  ECR_REGISTRY: 379549361550.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: fight-ai-web
  ECS_CLUSTER: fight-ai-web
  ECS_SERVICE: fight-ai-web
  ECS_TASK_FAMILY: fight-ai-web
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::379549361550:role/FightAIEcsTaskExecutionRole
  ECS_TASK_ROLE_ARN: arn:aws:iam::379549361550:role/FightAIEcsTaskRole
  FIGHT_AI_INGEST_BUCKET: fight-ai-video-ingest-379549361550-sa-east-1
  FIGHT_AI_JOBS_TABLE: fight-ai-analysis-jobs
  ALB_NAME: fight-ai-web-alb
  TARGET_GROUP_NAME: fight-ai-web-tg
  CLOUDFRONT_COMMENT: fight-ai-web-https
  CLOUDFRONT_WAF_NAME: fight-ai-cloudfront-free
  CLOUDFRONT_PLAN_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims safely
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")
          export TOKEN
          python - <<'PY'
          import base64, json, os
          payload=os.environ['TOKEN'].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload).decode())
          safe_keys=['iss','aud','sub','repository','repository_owner','ref','ref_type','workflow','job_workflow_ref','event_name']
          print('GitHub OIDC safe claims:')
          for key in safe_keys:
              if key in claims:
                  print(f'{key}={claims[key]}')
          expected='repo:pinoaraj@132783424/fight-ai@1348995885:ref:refs/heads/web/mvp'
          print(f'expected_sub={expected}')
          print(f'sub_matches_expected={claims.get("sub") == expected}')
          if claims.get('sub') != expected:
              raise SystemExit('Unexpected GitHub OIDC subject; refusing AWS deployment')
          PY

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.DEPLOY_REGION }}

      - name: Verify ECS deployment region is available
        run: |
          set -euo pipefail
          aws ec2 describe-vpcs --region "$DEPLOY_REGION" --max-results 5 >/dev/null
          aws ecs list-clusters --region "$DEPLOY_REGION" >/dev/null

      - name: Login to Amazon ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$ECR_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push web image
        run: |
          set -euo pipefail
          IMAGE_SHA="$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE_SHA" .
          docker push "$IMAGE_SHA"
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Provision ECS networking and load balancer
        run: |
          set -euo pipefail
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=is-default,Values=true --region "$DEPLOY_REGION" --query 'Vpcs[0].VpcId' --output text)
          test -n "$VPC_ID" && test "$VPC_ID" != "None"
          SUBNETS=$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$VPC_ID" --region "$DEPLOY_REGION" --query 'Subnets[].SubnetId' --output text)
          set -- $SUBNETS
          [ "$#" -ge 2 ]
          SUBNET1=$1; SUBNET2=$2

          ALB_SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=fight-ai-web-alb-sg Name=vpc-id,Values="$VPC_ID" --region "$DEPLOY_REGION" --query 'SecurityGroups[0].GroupId' --output text)
          if [ -z "$ALB_SG" ] || [ "$ALB_SG" = "None" ]; then
            ALB_SG=$(aws ec2 create-security-group --group-name fight-ai-web-alb-sg --description 'Fight AI web ALB' --vpc-id "$VPC_ID" --region "$DEPLOY_REGION" --query GroupId --output text)
          fi
          aws ec2 authorize-security-group-ingress --group-id "$ALB_SG" --protocol tcp --port 80 --cidr 0.0.0.0/0 --region "$DEPLOY_REGION" >/dev/null 2>&1 || true

          TASK_SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values=fight-ai-web-task-sg Name=vpc-id,Values="$VPC_ID" --region "$DEPLOY_REGION" --query 'SecurityGroups[0].GroupId' --output text)
          if [ -z "$TASK_SG" ] || [ "$TASK_SG" = "None" ]; then
            TASK_SG=$(aws ec2 create-security-group --group-name fight-ai-web-task-sg --description 'Fight AI web ECS tasks' --vpc-id "$VPC_ID" --region "$DEPLOY_REGION" --query GroupId --output text)
          fi
          aws ec2 authorize-security-group-ingress --group-id "$TASK_SG" --protocol tcp --port 3000 --source-group "$ALB_SG" --region "$DEPLOY_REGION" >/dev/null 2>&1 || true

          ALB_ARN=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --region "$DEPLOY_REGION" --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)
          if [ -z "$ALB_ARN" ] || [ "$ALB_ARN" = "None" ]; then
            ALB_ARN=$(aws elbv2 create-load-balancer --name "$ALB_NAME" --type application --scheme internet-facing --subnets "$SUBNET1" "$SUBNET2" --security-groups "$ALB_SG" --region "$DEPLOY_REGION" --query 'LoadBalancers[0].LoadBalancerArn' --output text)
            aws elbv2 wait load-balancer-available --load-balancer-arns "$ALB_ARN" --region "$DEPLOY_REGION"
          fi
          aws elbv2 modify-load-balancer-attributes --load-balancer-arn "$ALB_ARN" --attributes Key=idle_timeout.timeout_seconds,Value=1200 --region "$DEPLOY_REGION" >/dev/null

          TG_ARN=$(aws elbv2 describe-target-groups --names "$TARGET_GROUP_NAME" --region "$DEPLOY_REGION" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
          if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
            TG_ARN=$(aws elbv2 create-target-group --name "$TARGET_GROUP_NAME" --protocol HTTP --port 3000 --target-type ip --vpc-id "$VPC_ID" --health-check-path /api/health --health-check-protocol HTTP --region "$DEPLOY_REGION" --query 'TargetGroups[0].TargetGroupArn' --output text)
          fi

          LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --region "$DEPLOY_REGION" --query 'Listeners[?Port==`80`].ListenerArn | [0]' --output text)
          if [ -z "$LISTENER_ARN" ] || [ "$LISTENER_ARN" = "None" ]; then
            aws elbv2 create-listener --load-balancer-arn "$ALB_ARN" --protocol HTTP --port 80 --default-actions Type=forward,TargetGroupArn="$TG_ARN" --region "$DEPLOY_REGION" >/dev/null
          fi

          echo "SUBNET1=$SUBNET1" >> "$GITHUB_ENV"
          echo "SUBNET2=$SUBNET2" >> "$GITHUB_ENV"
          echo "TASK_SG=$TASK_SG" >> "$GITHUB_ENV"
          echo "TG_ARN=$TG_ARN" >> "$GITHUB_ENV"
          ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --region "$DEPLOY_REGION" --query 'LoadBalancers[0].DNSName' --output text)
          echo "ALB_DNS=$ALB_DNS" >> "$GITHUB_ENV"

      - name: Provision HTTPS CloudFront entry point
        continue-on-error: true
        run: |
          set -euo pipefail
          CLOUDFRONT_WAF_ARN=$(aws wafv2 list-web-acls --scope CLOUDFRONT --region "$CLOUDFRONT_PLAN_REGION" --query "WebACLs[?Name=='$CLOUDFRONT_WAF_NAME'].ARN | [0]" --output text)
          if [ -z "$CLOUDFRONT_WAF_ARN" ] || [ "$CLOUDFRONT_WAF_ARN" = "None" ]; then
            CLOUDFRONT_WAF_ARN=$(aws wafv2 create-web-acl --name "$CLOUDFRONT_WAF_NAME" --scope CLOUDFRONT --default-action 'Allow={}' --visibility-config 'SampledRequestsEnabled=false,CloudWatchMetricsEnabled=false,MetricName=fightAiCloudfrontFree' --rules '[]' --region "$CLOUDFRONT_PLAN_REGION" --query 'Summary.ARN' --output text)
          fi
          test -n "$CLOUDFRONT_WAF_ARN" && test "$CLOUDFRONT_WAF_ARN" != "None"
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='$CLOUDFRONT_COMMENT'].Id | [0]" --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            export ALB_DNS CLOUDFRONT_COMMENT CLOUDFRONT_WAF_ARN GITHUB_SHA
            python - <<'PY'
          import json, os
          origin_id='fight-ai-alb-origin'
          config={
            'CallerReference': f"fight-ai-web-{os.environ['GITHUB_SHA']}",
            'Comment': os.environ['CLOUDFRONT_COMMENT'],
            'Enabled': True,
            'HttpVersion': 'http2and3',
            'IsIPV6Enabled': True,
            'PriceClass': 'PriceClass_100',
            'Origins': {'Quantity': 1, 'Items': [{
              'Id': origin_id, 'DomainName': os.environ['ALB_DNS'], 'OriginPath': '',
              'CustomHeaders': {'Quantity': 0},
              'CustomOriginConfig': {
                'HTTPPort': 80, 'HTTPSPort': 443, 'OriginProtocolPolicy': 'http-only',
                'OriginSslProtocols': {'Quantity': 1, 'Items': ['TLSv1.2']},
                'OriginReadTimeout': 120, 'OriginKeepaliveTimeout': 60,
              },
            }]},
            'DefaultCacheBehavior': {
              'TargetOriginId': origin_id, 'ViewerProtocolPolicy': 'redirect-to-https', 'Compress': True,
              'AllowedMethods': {'Quantity': 7, 'Items': ['GET','HEAD','OPTIONS','PUT','PATCH','POST','DELETE'], 'CachedMethods': {'Quantity': 2, 'Items': ['GET','HEAD']}},
              'ForwardedValues': {'QueryString': True, 'QueryStringCacheKeys': {'Quantity': 0}, 'Headers': {'Quantity': 1, 'Items': ['*']}, 'Cookies': {'Forward': 'all'}},
              'MinTTL': 0, 'DefaultTTL': 0, 'MaxTTL': 0,
              'TrustedSigners': {'Enabled': False, 'Quantity': 0}, 'TrustedKeyGroups': {'Enabled': False, 'Quantity': 0},
              'LambdaFunctionAssociations': {'Quantity': 0}, 'FunctionAssociations': {'Quantity': 0},
            },
            'Restrictions': {'GeoRestriction': {'RestrictionType': 'none', 'Quantity': 0}},
            'ViewerCertificate': {'CloudFrontDefaultCertificate': True, 'MinimumProtocolVersion': 'TLSv1.2_2021'},
            'WebACLId': os.environ['CLOUDFRONT_WAF_ARN'],
          }
          with open('/tmp/fight-ai-cloudfront.json','w',encoding='utf-8') as out: json.dump(config,out)
          PY
            DISTRIBUTION_ID=$(aws cloudfront create-distribution --distribution-config file:///tmp/fight-ai-cloudfront.json --query 'Distribution.Id' --output text)
          fi
          aws cloudfront wait distribution-deployed --id "$DISTRIBUTION_ID"
          DISTRIBUTION_ARN="arn:aws:cloudfront::379549361550:distribution/$DISTRIBUTION_ID"
          if ! aws pricing-plan-manager create-subscription --plan-family CloudFront --plan-tier FREE --resource-arns "$DISTRIBUTION_ARN" "$CLOUDFRONT_WAF_ARN" --approval-mode IMMEDIATE --client-token "fight-ai-cloudfront-free-$DISTRIBUTION_ID" --region "$CLOUDFRONT_PLAN_REGION" >/dev/null 2>&1; then
            echo "CloudFront FREE plan subscription unavailable for this distribution; keeping the deployed HTTPS distribution without the optional plan subscription." >&2
          fi
          CLOUDFRONT_DOMAIN=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query 'Distribution.DomainName' --output text)
          test -n "$CLOUDFRONT_DOMAIN" && test "$CLOUDFRONT_DOMAIN" != "None"
          echo "CLOUDFRONT_DOMAIN=$CLOUDFRONT_DOMAIN" >> "$GITHUB_ENV"
          echo "Fight AI HTTPS URL: https://$CLOUDFRONT_DOMAIN"

      - name: Register task definition and deploy ECS service
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          aws ecs create-cluster --cluster-name "$ECS_CLUSTER" --region "$DEPLOY_REGION" >/dev/null 2>&1 || true
          python - <<'PY'
          import json, os
          td={"family":os.environ["ECS_TASK_FAMILY"],"networkMode":"awsvpc","requiresCompatibilities":["FARGATE"],"cpu":"2048","memory":"4096","executionRoleArn":os.environ["ECS_EXECUTION_ROLE_ARN"],"taskRoleArn":os.environ["ECS_TASK_ROLE_ARN"],"containerDefinitions":[{"name":"fight-ai-web","image":os.environ["IMAGE_SHA"],"essential":True,"portMappings":[{"containerPort":3000,"protocol":"tcp"}],"environment":[{"name":"GEMINI_API_KEY","value":os.environ["GEMINI_API_KEY"]},{"name":"GEMINI_MODEL","value":"gemini-2.5-flash"},{"name":"FIGHT_AI_INGEST_BUCKET","value":os.environ["FIGHT_AI_INGEST_BUCKET"]},{"name":"FIGHT_AI_JOBS_TABLE","value":os.environ["FIGHT_AI_JOBS_TABLE"]},{"name":"FIGHT_AI_BUILD_SHA","value":os.environ["GITHUB_SHA"]},{"name":"NODE_OPTIONS","value":"--max-old-space-size=3328"}]}]}
          with open('/tmp/task-def.json','w',encoding='utf-8') as f: json.dump(td,f)
          PY
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/task-def.json --region "$DEPLOY_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)
          SERVICE_STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$DEPLOY_REGION" --query 'services[0].status' --output text 2>/dev/null || true)
          NETWORK="awsvpcConfiguration={subnets=[$SUBNET1,$SUBNET2],securityGroups=[$TASK_SG],assignPublicIp=ENABLED}"
          if [ -z "$SERVICE_STATUS" ] || [ "$SERVICE_STATUS" = "None" ]; then
            aws ecs create-service --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" --task-definition "$TASK_DEF_ARN" --desired-count 1 --launch-type FARGATE --network-configuration "$NETWORK" --load-balancers targetGroupArn="$TG_ARN",containerName=fight-ai-web,containerPort=3000 --health-check-grace-period-seconds 90 --region "$DEPLOY_REGION" >/dev/null
          else
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_DEF_ARN" --desired-count 1 --force-new-deployment --region "$DEPLOY_REGION" >/dev/null
          fi
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$DEPLOY_REGION"

          aws logs create-log-group --log-group-name /ecs/fight-ai-analysis-worker --region "$DEPLOY_REGION" >/dev/null 2>&1 || true
          export IMAGE_SHA ECS_TASK_FAMILY ECS_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN FIGHT_AI_JOBS_TABLE ALB_DNS DEPLOY_REGION
          python - <<'PY'
          import json, os
          td={"family":"fight-ai-analysis-worker","networkMode":"awsvpc","requiresCompatibilities":["FARGATE"],"cpu":"1024","memory":"2048","executionRoleArn":os.environ["ECS_EXECUTION_ROLE_ARN"],"taskRoleArn":os.environ["ECS_TASK_ROLE_ARN"],"containerDefinitions":[{"name":"fight-ai-worker","image":os.environ["IMAGE_SHA"],"essential":True,"command":["node","scripts/analysis-worker.mjs"],"environment":[{"name":"FIGHT_AI_JOBS_TABLE","value":os.environ["FIGHT_AI_JOBS_TABLE"]},{"name":"FIGHT_AI_WORKER_ENDPOINT","value":"http://"+os.environ["ALB_DNS"]}],"logConfiguration":{"logDriver":"awslogs","options":{"awslogs-group":"/ecs/fight-ai-analysis-worker","awslogs-region":os.environ["DEPLOY_REGION"],"awslogs-stream-prefix":"worker"}}}]}
          with open('/tmp/worker-task-def.json','w',encoding='utf-8') as f: json.dump(td,f)
          PY
          WORKER_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file:///tmp/worker-task-def.json --region "$DEPLOY_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)
          WORKER_STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services fight-ai-analysis-worker --region "$DEPLOY_REGION" --query 'services[0].status' --output text 2>/dev/null || true)
          if [ -z "$WORKER_STATUS" ] || [ "$WORKER_STATUS" = "None" ]; then
            aws ecs create-service --cluster "$ECS_CLUSTER" --service-name fight-ai-analysis-worker --task-definition "$WORKER_TASK_DEF" --desired-count 1 --launch-type FARGATE --network-configuration "$NETWORK" --region "$DEPLOY_REGION" >/dev/null
          else
            aws ecs update-service --cluster "$ECS_CLUSTER" --service fight-ai-analysis-worker --task-definition "$WORKER_TASK_DEF" --desired-count 1 --force-new-deployment --region "$DEPLOY_REGION" >/dev/null
          fi
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services fight-ai-analysis-worker --region "$DEPLOY_REGION"

      - name: Verify public site and runtime configuration
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFRONT_DOMAIN:-}" ]; then
            URL="https://$CLOUDFRONT_DOMAIN"
          else
            URL="http://$ALB_DNS"
            echo "WARNING: CloudFront HTTPS domain was not resolved; verifying the deployed ALB origin as a fallback." >&2
          fi
          echo "Fight AI URL: $URL"
          READY=0
          for i in $(seq 1 30); do
            if HEALTH=$(curl --fail --max-time 10 "$URL/api/health" 2>/dev/null); then
              echo "$HEALTH"
              if echo "$HEALTH" | grep -q '"analysisReady":true' \
                && echo "$HEALTH" | grep -q '"geminiConfigured":true' \
                && echo "$HEALTH" | grep -q "\"buildSha\":\"$GITHUB_SHA\""; then
                READY=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo "Fight AI public runtime never reached expected build SHA $GITHUB_SHA." >&2
            exit 1
          fi
          echo "AWS/HTTPS runtime VERIFIED for $GITHUB_SHA."
          echo "Full Gemini video analysis is verified by Web Streaming Production Smoke."
