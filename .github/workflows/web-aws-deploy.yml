name: Web AWS Deploy

on:
  workflow_dispatch:
  push:
    branches: [web/mvp]
    paths:
      - '.github/workflows/web-aws-deploy.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'tsconfig.json'
      - 'app/**'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::379549361550:role/FightAIGitHubDeployRole
  ECR_REPOSITORY: fight-ai-web
  APP_RUNNER_ACCESS_ROLE_ARN: arn:aws:iam::379549361550:role/FightAIAppRunnerECRAccessRole
  APP_RUNNER_INSTANCE_ROLE_ARN: arn:aws:iam::379549361550:role/FightAIAppRunnerInstanceRole
  APP_RUNNER_SERVICE_NAME: fight-ai-web
  GEMINI_SECRET_NAME: fight-ai/gemini-api-key

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision Gemini runtime secret and App Runner instance role
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"

          if aws secretsmanager describe-secret --secret-id "$GEMINI_SECRET_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id "$GEMINI_SECRET_NAME" --secret-string "$GEMINI_API_KEY" --region "$AWS_REGION" >/dev/null
          else
            aws secretsmanager create-secret --name "$GEMINI_SECRET_NAME" --secret-string "$GEMINI_API_KEY" --region "$AWS_REGION" >/dev/null
          fi
          SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$GEMINI_SECRET_NAME" --region "$AWS_REGION" --query ARN --output text)
          echo "GEMINI_SECRET_ARN=$SECRET_ARN" >> "$GITHUB_ENV"

          cat >/tmp/apprunner-instance-trust.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{"Effect":"Allow","Principal":{"Service":"tasks.apprunner.amazonaws.com"},"Action":"sts:AssumeRole"}]
          }
          JSON

          if ! aws iam get-role --role-name FightAIAppRunnerInstanceRole >/dev/null 2>&1; then
            aws iam create-role --role-name FightAIAppRunnerInstanceRole --assume-role-policy-document file:///tmp/apprunner-instance-trust.json >/dev/null
          else
            aws iam update-assume-role-policy --role-name FightAIAppRunnerInstanceRole --policy-document file:///tmp/apprunner-instance-trust.json >/dev/null
          fi

          cat >/tmp/apprunner-instance-policy.json <<JSON
          {
            "Version":"2012-10-17",
            "Statement":[{"Effect":"Allow","Action":["secretsmanager:GetSecretValue"],"Resource":"$SECRET_ARN"}]
          }
          JSON
          aws iam put-role-policy --role-name FightAIAppRunnerInstanceRole --policy-name FightAIGeminiSecretRead --policy-document file:///tmp/apprunner-instance-policy.json >/dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push web image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          IMAGE_LATEST="$REGISTRY/$ECR_REPOSITORY:latest"
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> "$GITHUB_ENV"

      - name: Create or update App Runner service
        run: |
          set -euo pipefail
          SERVICE_ARN=$(aws apprunner list-services --region "$AWS_REGION" --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE_NAME'].ServiceArn | [0]" --output text)
          cat >/tmp/source-config.json <<JSON
          {
            "AuthenticationConfiguration":{"AccessRoleArn":"$APP_RUNNER_ACCESS_ROLE_ARN"},
            "AutoDeploymentsEnabled":false,
            "ImageRepository":{
              "ImageIdentifier":"$IMAGE_LATEST",
              "ImageRepositoryType":"ECR",
              "ImageConfiguration":{
                "Port":"3000",
                "RuntimeEnvironmentSecrets":{"GEMINI_API_KEY":"$GEMINI_SECRET_ARN"},
                "RuntimeEnvironmentVariables":{"GEMINI_MODEL":"gemini-2.5-flash"}
              }
            }
          }
          JSON

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            cat >/tmp/apprunner.json <<JSON
          {
            "ServiceName":"$APP_RUNNER_SERVICE_NAME",
            "SourceConfiguration":$(cat /tmp/source-config.json),
            "InstanceConfiguration":{"Cpu":"1 vCPU","Memory":"2 GB","InstanceRoleArn":"$APP_RUNNER_INSTANCE_ROLE_ARN"},
            "HealthCheckConfiguration":{"Protocol":"HTTP","Path":"/api/health","Interval":10,"Timeout":5,"HealthyThreshold":1,"UnhealthyThreshold":5}
          }
          JSON
            aws apprunner create-service --region "$AWS_REGION" --cli-input-json file:///tmp/apprunner.json >/dev/null
          else
            aws apprunner update-service \
              --service-arn "$SERVICE_ARN" \
              --region "$AWS_REGION" \
              --source-configuration file:///tmp/source-config.json \
              --instance-configuration "Cpu=1 vCPU,Memory=2 GB,InstanceRoleArn=$APP_RUNNER_INSTANCE_ROLE_ARN" >/dev/null
          fi

      - name: Show service URL and verify health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            SERVICE_ARN=$(aws apprunner list-services --region "$AWS_REGION" --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE_NAME'].ServiceArn | [0]" --output text)
            if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
              STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --region "$AWS_REGION" --query 'Service.Status' --output text)
              URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --region "$AWS_REGION" --query 'Service.ServiceUrl' --output text)
              echo "App Runner status: $STATUS"
              echo "Fight AI URL: https://$URL"
              if [ "$STATUS" = "RUNNING" ]; then
                curl --fail --retry 12 --retry-delay 10 "https://$URL/api/health"
                exit 0
              fi
              if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then exit 1; fi
            fi
            sleep 15
          done
          echo 'App Runner did not reach RUNNING within the workflow window.' >&2
          exit 1
