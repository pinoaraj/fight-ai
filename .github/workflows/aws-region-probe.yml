name: AWS Compute Region Probe

on:
  workflow_dispatch:
  push:
    branches: [web/mvp]
    paths:
      - '.github/workflows/aws-region-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::379549361550:role/FightAIGitHubDeployRole
          aws-region: us-east-2
      - name: Probe commercial AWS regions without creating resources
        run: |
          set -u
          regions=(
            us-east-1 us-east-2 us-west-1 us-west-2
            ca-central-1 sa-east-1
            eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-north-1
            ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-south-1
          )
          for region in "${regions[@]}"; do
            echo "--- $region ---"
            if aws ec2 describe-vpcs --region "$region" --max-results 5 >/tmp/ec2-out 2>/tmp/ec2-err; then
              if aws ecs list-clusters --region "$region" >/tmp/ecs-out 2>/tmp/ecs-err; then
                echo "AVAILABLE_REGION=$region"
                exit 0
              fi
              echo "EC2 available but ECS failed: $(cat /tmp/ecs-err)"
            else
              echo "EC2 unavailable: $(cat /tmp/ec2-err)"
            fi
          done
          echo "NO_EC2_REGION_AVAILABLE"
          exit 1
