name: Web MVP CI

on:
  push:
    branches: [web/mvp]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
